/* Layout: tek ekranlık oyun. Harita ekranı adanın bölgeleri (kaydırılabilir kartlar); oyun ekranı üst bar, konuşma balonu, kumsal çerçeveli tahta, alt kontroller. Tek, bilinçli gündüz/deniz teması. */
:root{
  --sky:#D2F0FF; --sky2:#F1FAFF; --sea:#62C2E6; --sea2:#2F9ACB; --sand:#F6E2AE; --sandD:#D9B46A;
  --ink:#2F2A3A; --muted:#6A6478; --card:#FFFFFF; --cardEdge:#C3D9E8;
  --sun:#FFC83D; --sunD:#C98A12;
  --grassL:#DDF1B0; --grassD:#AEDA78;
  --wood:#C48D58; --woodD:#8D5B32;
  --go:#FF7A59; --goD:#D4542F; --lock:#B9B5C4; --lockD:#8F8A9C;
  --display:"Baloo 2","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  margin:0;color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden;
  background:linear-gradient(180deg,#EAF8FF 0%,var(--sky) 42%,#9EDDF2 72%,var(--sea) 100%);
  background-color:#9EDDF2;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--go);outline-offset:3px}
svg{display:block;overflow:visible}
input,textarea{user-select:text;-webkit-user-select:text}
#app{position:relative;z-index:1}
.sea{position:fixed;left:0;right:0;bottom:0;height:15vh;min-height:64px;pointer-events:none;z-index:0;overflow:hidden}
.sea svg{position:absolute;bottom:0;left:0;width:200%;height:100%;animation:drift 16s linear infinite}
.sea svg+svg{animation-duration:10s;animation-direction:reverse}
@keyframes drift{to{transform:translateX(-50%)}}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:56px;height:56px;flex:none}
.brand .bt{min-width:0}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:flex;align-items:center;gap:8px;min-width:0;background:var(--card);border-radius:999px;padding:6px 12px 6px 6px;box-shadow:0 4px 0 var(--cardEdge);font-family:var(--display);font-weight:800;font-size:17px;line-height:1}
.chip .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-top:2px}
.chip svg{width:14px;height:14px;flex:none}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:16px;flex:none;padding-top:2px;box-sizing:border-box}
.region{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sea2)}
.region svg{width:16px;height:16px}
.sec{text-align:left;margin-top:16px}
.sec h4{margin:0 0 6px;font-family:var(--display);font-weight:800;font-size:19px}
.sec .small{margin:0 0 8px;font-size:14px;max-width:none}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--sky2);border-radius:14px;margin-top:6px;min-width:0}
.prow{flex-wrap:wrap}
.prow .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.prow input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 10px;border-radius:10px;border:2px solid var(--cardEdge);background:#fff;color:var(--ink)}
.sbtn{font-family:var(--display);font-weight:800;font-size:15px;line-height:1;padding:9px 12px 7px;border-radius:12px;background:#fff;box-shadow:0 3px 0 var(--cardEdge);flex:none}
.sbtn.warn{background:#FFE1DA;box-shadow:0 3px 0 #F0A898}
.sbtn.on{background:#D7F5E6;box-shadow:0 3px 0 #8FD3B1}
.pickgrid{display:grid;gap:10px;margin-top:14px}
.pickgrid button{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:var(--sky2);box-shadow:0 4px 0 var(--cardEdge);font-family:var(--display);font-weight:800;font-size:20px;text-align:left}
.pickgrid button.cur{background:#FFF4D6;box-shadow:0 4px 0 #E8D39A}
.pickgrid .dot{width:40px;height:40px;font-size:20px}
.scroll-card{max-height:calc(100dvh - 40px);overflow-y:auto}
.warnbox{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:#FFE1DA;color:#8A2D17;font-size:14px;line-height:1.35;text-align:left}
.warnbox .sbtn{margin-top:6px}
.hsheet{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(47,42,58,.25);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px;max-width:560px;margin:0 auto}
.hsheet h4{margin:0 0 2px;font-family:var(--display);font-size:18px}
.hsheet button{text-align:left;padding:12px 14px;border-radius:14px;background:var(--sky2);box-shadow:0 3px 0 var(--cardEdge);font-weight:800;font-size:16px}
.hsheet button.late{background:#FFF4D6;box-shadow:0 3px 0 #E8D39A}
.hsheet button.cx{background:transparent;box-shadow:none;text-align:center;color:var(--muted)}
.steps{display:grid;gap:8px;margin:14px auto 0;max-width:330px;justify-items:center}
.srow{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.srow .sl{width:34px;height:34px;flex:none;margin-right:6px}
.srow .sl svg{width:100%;height:100%}
.fp{width:24px;height:24px;display:inline-block;animation:pop-in .35s cubic-bezier(.3,1.6,.5,1) backwards}
.fp svg{width:100%;height:100%}
.fp.me{color:var(--muted)} .fp.goal{color:var(--sunD)}
.srow b{font-family:var(--display);font-size:15px;color:var(--muted)}
.dot.av{padding:0;overflow:hidden}
.dot.av svg{width:86%;height:86%;margin:7%}
textarea#jsonIn{width:100%;box-sizing:border-box;height:80px;margin-top:4px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;border-radius:10px;border:2px solid var(--cardEdge);padding:8px;color:var(--ink);background:#fff}

.vt{flex:1;min-width:0;font-size:14px;line-height:1.3}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px;margin-top:6px;text-align:left}
.sum b{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.sum .h{grid-column:1 / -1;margin-top:10px;font-family:var(--display);font-weight:800;font-size:17px;color:var(--sea2)}
.sum .z{color:var(--muted)}
textarea#jsonOut{width:100%;box-sizing:border-box;height:120px;margin-top:8px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;border-radius:10px;border:2px solid var(--cardEdge);padding:8px;color:var(--ink);background:#fff}
#adultBtn.ok{background:#D7F5E6;box-shadow:0 4px 0 #8FD3B1}

#app{
  height:100%;max-width:560px;margin:0 auto;box-sizing:border-box;
  display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;
}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}

/* Ortak parçalar */
.round{
  width:46px;height:46px;border-radius:50%;background:var(--card);
  display:grid;place-items:center;box-shadow:0 4px 0 var(--cardEdge);flex:none;
  transition:transform .08s,box-shadow .08s;
}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cardEdge)}
.round svg{width:24px;height:24px}
.btn{
  font-family:var(--display);font-weight:800;font-size:20px;line-height:1;
  padding:14px 22px 12px;border-radius:18px;background:var(--go);color:#fff;
  box-shadow:0 5px 0 var(--goD);transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--goD)}
.btn.soft{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--cardEdge)}
.btn.soft:active{box-shadow:0 1px 0 var(--cardEdge)}

/* Harita */
.top{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 4px 0 var(--cardEdge);flex:none}
.seg button{font-family:var(--display);font-weight:800;font-size:16px;line-height:1;padding:8px 12px 6px;border-radius:999px;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.brand h1{
  margin:0;font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,40px);
  line-height:1;letter-spacing:-.01em;text-wrap:balance;
}
.brand h1 span{color:var(--go)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:15px}
.pill{
  display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;
  padding:8px 12px 8px 9px;box-shadow:0 4px 0 var(--cardEdge);
  font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;flex:none;
}
.pill svg{width:20px;height:20px}
.pill span+svg{margin-left:6px}
.ainote{margin:-6px 0 0;text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.map-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px 2px 18px;margin:0 -2px}
.world{
  background:var(--card);border-radius:22px;padding:12px 14px 14px;
  display:grid;grid-template-columns:64px 1fr;column-gap:12px;align-items:center;
  box-shadow:0 5px 0 var(--cardEdge);
  animation:enter .55s cubic-bezier(.3,1.35,.5,1) backwards;animation-delay:calc(var(--i,0) * 70ms);
}
.world .ava{grid-row:span 3;width:64px;height:64px;border-radius:18px;display:grid;place-items:center}
.world .ava svg{width:56px;height:56px}
.world h2{margin:0;font-family:var(--display);font-weight:800;font-size:21px;line-height:1.1}
.world .skill{color:var(--muted);font-size:14px}
.lvls{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.lv{display:flex;flex-direction:column;align-items:center;gap:4px}
.lv button{
  width:52px;height:52px;border-radius:50%;color:#fff;
  font-family:var(--display);font-weight:800;font-size:24px;line-height:1;padding-top:3px;
  display:grid;place-items:center;transition:transform .08s;
}
.lv button:active{transform:translateY(3px) scale(.95)}
.lv button.now{animation:beckon 1.6s ease-in-out infinite}
.lv button.locked{background:var(--lock)!important;box-shadow:0 4px 0 var(--lockD)!important;padding-top:0}
.lv button.locked svg{width:22px;height:22px}
.mini{display:flex;gap:1px}
.mini svg{width:16px;height:16px}
.world.palace{background:repeating-linear-gradient(-45deg,#FFF8E5 0 14px,#FFF2CF 14px 28px);box-shadow:0 5px 0 #E8D39A}
.palace .ava{background:var(--sun)}
.tag.soon{background:var(--muted)}
.lv button.paid{background:var(--sun)!important;box-shadow:0 4px 0 var(--sunD)!important}
.tag{
  display:inline-block;margin-left:6px;vertical-align:3px;font-family:var(--body);font-size:11px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:6px;padding:3px 6px 2px;
}

/* Oyun ekranı */
.ptitle{flex:1;min-width:0;text-align:center}
.ptitle b{display:block;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05}
.ptitle small{color:var(--muted);font-size:13px}
.talk{display:flex;align-items:flex-end;gap:10px}
.talk .ava{width:58px;height:58px;flex:none}
.bubble{
  position:relative;flex:1;min-width:0;background:var(--card);border-radius:18px;
  padding:10px 12px;font-size:16px;line-height:1.3;box-shadow:0 4px 0 var(--cardEdge);
  min-height:44px;display:flex;align-items:center;gap:8px;transform-origin:0 100%;
}
.bubble::before{
  content:"";position:absolute;left:-9px;bottom:14px;width:18px;height:18px;background:var(--card);
  transform:rotate(45deg);border-radius:3px;
}
.bubble span{position:relative;flex:1;min-width:0}
.bubble .say{width:36px;height:36px;border-radius:50%;background:var(--sky);display:grid;place-items:center;flex:none;position:relative}
.bubble .say svg{width:20px;height:20px}
.boardwrap{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
.board{
  width:min(100cqw,100cqh);aspect-ratio:1;max-width:100%;box-sizing:border-box;
  background:radial-gradient(rgba(201,160,90,.35) 1.2px,transparent 1.7px) 0 0/13px 13px,var(--sand);border-radius:22px;padding:3%;
  box-shadow:0 6px 0 var(--sandD),0 0 0 6px rgba(255,255,255,.55),0 6px 0 6px rgba(255,255,255,.35);
}
.field{position:relative;width:100%;height:100%;border-radius:12px;overflow:hidden}
.cells{position:absolute;inset:0;display:grid}
.cell{position:relative;background:var(--grassL)}
.cell.d{background:var(--grassD)}
.cell .cr,.cell .cf{position:absolute;font-family:var(--display);font-weight:800;font-size:clamp(8px,2.4cqw,12px);line-height:1;color:#6E9A3E;pointer-events:none}
.cell.d .cr,.cell.d .cf{color:#F1FAD9}
.cell .cr{left:6%;top:6%}
.cell .cf{right:7%;bottom:5%}
.cell.can::after{
  content:"";position:absolute;inset:34%;border-radius:50%;
  background:rgba(255,255,255,.85);box-shadow:0 0 0 4px var(--go);
  animation:dot-in .3s cubic-bezier(.3,1.6,.5,1) backwards, pulse 1.2s ease-in-out .3s infinite;
}
.layer{position:absolute;inset:0;pointer-events:none}
.it{position:absolute;display:grid;place-items:center}
.it>svg{width:80%;height:80%}
.it.star>svg{width:66%;height:66%;animation:twinkle 2.4s ease-in-out infinite}
.it.rock>svg{width:84%;height:84%}
.it.ghost>svg{animation:float 2.2s ease-in-out infinite}
.it.piece{z-index:3}
.ground{position:absolute;inset:0}
.shadow{position:absolute;left:21%;right:21%;bottom:5%;height:11%;border-radius:50%;background:rgba(47,42,58,.22)}
.body{position:absolute;inset:3% 4% 6%;transform-origin:50% 92%}
.flip{width:100%;height:100%;transition:transform .18s ease-out}
.piece.right .flip{transform:scaleX(-1)}
.body svg{width:100%;height:100%;transform-origin:50% 92%;animation:breathe 2.8s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
.fx{position:absolute;pointer-events:none;z-index:4}
.puff{position:absolute;left:50%;bottom:6%;width:20%;height:20%;margin-left:-10%;border-radius:50%;background:#fff}
.spark{position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%}
.dotp{position:absolute;left:50%;top:50%;width:11%;height:11%;margin:-5.5% 0 0 -5.5%;border-radius:50%}
.ring{position:absolute;inset:10%;border-radius:50%;border:4px solid var(--sun)}
.flystar{position:fixed;z-index:30;pointer-events:none}
.flystar svg{width:100%;height:100%}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tools{display:flex;gap:10px}
.round:disabled{opacity:.4;cursor:default}
.round.now{animation:beckon 1.4s ease-in-out infinite}
.stats{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:0}
.field{touch-action:none}
.cell.over{box-shadow:inset 0 0 0 4px rgba(255,122,89,.9)}
.piece.dragging{z-index:6}
.piece.dragging .body{transform:translateY(-18%) scale(1.14);transition:transform .15s ease-out}
.piece.dragging .shadow{transform:scale(.75);opacity:.55;transition:transform .15s,opacity .15s}
.handfx{z-index:7}
.tapring{position:absolute;inset:22%;border-radius:50%;border:4px solid #fff;animation:ring 1.2s ease-out infinite}
.hand{position:absolute;left:50%;top:50%;width:80%;margin-left:-28%;margin-top:-3%;animation:tap 1.2s ease-in-out infinite;filter:drop-shadow(0 3px 0 rgba(47,42,58,.25))}
.hand svg{width:100%;height:auto}
@keyframes tap{0%,100%{transform:translate(14%,22%)}45%,55%{transform:translate(0,0) scale(.92)}}
@keyframes ring{0%,42%{transform:scale(.3);opacity:0}52%{opacity:1}100%{transform:scale(1.35);opacity:0}}
.moves{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.moves small{font-family:var(--body);font-size:13px;color:var(--muted);margin-right:6px;letter-spacing:.06em;text-transform:uppercase}
.goal{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.goal svg{width:24px;height:24px}

/* Pencereler */
.modal{
  position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(47,42,58,.5);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  animation:fade .25s ease-out;
}
.card{
  position:relative;width:100%;max-width:380px;box-sizing:border-box;background:var(--card);border-radius:28px;
  padding:22px 20px 24px;text-align:center;box-shadow:0 8px 0 var(--cardEdge);animation:rise .45s cubic-bezier(.3,1.35,.5,1);
}
.card h3{margin:6px 0 4px;font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.card p{margin:6px auto 0;max-width:30ch;color:var(--muted);font-size:16px;line-height:1.4}
.card .hero{width:116px;height:116px;margin:0 auto}
.card .hero svg{width:100%;height:100%;transform-origin:50% 92%;animation:cheer 1.1s ease-in-out infinite}
.bigstars{display:flex;justify-content:center;gap:6px;margin:12px 0 4px}
.bigstars svg{width:48px;height:48px}
.bigstars{align-items:flex-end}
.bigstars .bloom{width:76px;height:76px;animation:bloom .7s cubic-bezier(.3,1.6,.5,1) .15s both}
.it.flag>svg{width:88%;height:88%}
.it.flag.no{opacity:.35;filter:grayscale(1)}
.cell.trail{box-shadow:inset 0 0 0 5px var(--sun)}
.cell.trail::before{content:attr(data-n);position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(14px,4cqw,22px);color:var(--sunD)}
@keyframes bloom{from{transform:scale(0) rotate(-90deg)}}
.bigstars .on{animation:pop-in .5s cubic-bezier(.3,1.7,.5,1) both}
.bigstars .on:nth-child(1){animation-delay:.2s}
.bigstars .on:nth-child(2){animation-delay:.45s}
.bigstars .on:nth-child(3){animation-delay:.7s}
.row{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.opts{display:flex;gap:10px;justify-content:center;margin-top:16px}
.opts{flex-wrap:wrap}
.opts .btn{min-width:62px;padding-inline:14px}
.q{font-family:var(--display);font-weight:800;font-size:30px;margin-top:12px;font-variant-numeric:tabular-nums}
.perks{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px;text-align:left}
.perks li{display:flex;gap:10px;align-items:center;background:var(--sky2);border-radius:12px;padding:9px 12px;font-size:15px}
.perks li svg{width:20px;height:20px;flex:none}
.note{font-size:13px!important;margin-top:12px!important}
canvas#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:28px}

@keyframes pulse{0%,100%{transform:scale(.85)}50%{transform:scale(1.05)}}
@keyframes dot-in{from{transform:scale(0)}}
@keyframes twinkle{0%,100%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7%)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(.985,1.03)}}
@keyframes blink{0%,92%,97%,100%{transform:scaleY(1)}94.5%{transform:scaleY(.1)}}
@keyframes cheer{0%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(3%) scale(1.1,.88)}55%{transform:translateY(-20%) scale(.94,1.08) rotate(-4deg)}80%{transform:translateY(2%) scale(1.06,.93)}}
@keyframes beckon{0%,70%,100%{transform:translateY(0)}78%{transform:translateY(-9px) scale(1.04)}86%{transform:translateY(1px) scale(1.05,.95)}}
@keyframes enter{from{transform:translateY(28px) scale(.95)}}
@keyframes pop-in{from{transform:scale(0) rotate(-60deg)}}
@keyframes rise{from{transform:translateY(40px) scale(.85)}}
@keyframes fade{from{background:rgba(47,42,58,0)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

/* ---------- Kayıt ---------- */
/* Kayıt v4: her çocuğun kendi profili (başarılar + öğrenme kaydı). Kimlikler bölüm verisinde yazılı.
   Eski kayıtlar silinmez; anlamı kesin olmayan başarılar başka bölüme aktarılmaz. */
var SAVE="satranc-adasi-v4";
var PCOL=["#FF7A59","#24B3A2","#9B6BE0","#3E7BE0","#F4A33A","#EE6FA0"];
var prog={players:{},current:null,muted:false,lang:null,trial:false};
var mDone=null,mLog=null;
function copySettings(o){["muted","lang","full","legacyV1"].forEach(function(k){if(o&&k in o)prog[k]=o[k];});}
try{
  var raw=localStorage.getItem(SAVE);
  if(raw)prog=Object.assign(prog,JSON.parse(raw));
  else{
    mDone={};mLog={};
    var v3=localStorage.getItem("satranc-bahcesi-v3"),v2=localStorage.getItem("satranc-bahcesi-v2"),v1=localStorage.getItem("satranc-bahcesi-v1");
    if(v3){v3=JSON.parse(v3);copySettings(v3);mDone=v3.done||{};mLog=v3.log||{};}
    else if(v2){
      v2=JSON.parse(v2);copySettings(v2);
      var map={};LEVELS.forEach(function(L){map[L.v2id]=L.id;});
      Object.keys(v2.done||{}).forEach(function(k){if(map[k])mDone[map[k]]=v2.done[k];});
      Object.keys(v2.log||{}).forEach(function(k){if(map[k])mLog[map[k]]=v2.log[k];});
    }else if(v1){
      v1=JSON.parse(v1);copySettings(v1);
      var keys=Object.keys(v1.stars||{}).map(Number);
      /* v1 farklı düzenlerde kullanıldı; yalnızca 60+ sıra varsa 66 bölümlük düzen kesindir */
      if(keys.some(function(i){return i>=60;})){
        keys.forEach(function(i){var v=v1.stars[i];if(v>0&&LEVELS[i])mDone[LEVELS[i].id]=v===3?3:1;});
      }else if(keys.length){prog.legacyV1=v1.stars;}
    }
  }
}catch(e){}
if(prog.lang!=="tr"&&prog.lang!=="en"){prog.lang=((navigator.language||"tr").toLowerCase().indexOf("tr")===0)?"tr":"en";}
if(!prog.players[prog.current]){
  var pids=Object.keys(prog.players);
  if(pids.length)prog.current=pids[0];
  else{prog.players.p1={name:(prog.lang==="tr"?"Oyuncu":"Player")+" 1",color:PCOL[0],done:mDone||{},log:mLog||{}};prog.current="p1";}
}
/* Tarayıcı kapanınca açık kalmış testleri "kesintiye uğradı" olarak işaretle */
Object.keys(prog.players).forEach(function(pid){var lg=prog.players[pid].log||{};
  Object.keys(lg).forEach(function(id){(lg[id].quizzes||[]).concat(lg[id].attempts||[]).forEach(function(q){if(q.status==="started"||q.status==="in-progress")q.status="interrupted";});});});
try{localStorage.setItem(SAVE,JSON.stringify(prog));}catch(e){}
function PL(){return prog.players[prog.current];}
var saveFail=false;
function save(){try{localStorage.setItem(SAVE,JSON.stringify(prog));saveFail=false;}catch(e){saveFail=true;}}
/* Her dünyanın ilk bölümü açık; diğerleri bir önceki geçilince açılır */
/* Ücretsiz: Kale ve Fil dünyaları + diğer dünyaların ilk (tanışma) bölümü */
function isPaid(i){return LEVELS[i].world>=2&&!LEVELS[i].first;}
function owned(i){return !isPaid(i)||!!prog.full;}
/* Öğrenme kaydı: deneme, hata türü, açılan yardım, geri alma, testte ilk deneme */
function logOf(){
  var id=S.L.id,lg=PL().log,l=lg[id];
  if(!l)l=lg[id]={tries:0,wins:0,err:{},help:{},undo:0};
  if(S.quiz&&!l.quizzes)l.quizzes=[];
  return l;
}
function logErr(k){var l=logOf();l.err[k]=(l.err[k]||0)+1;save();}
function logHelp(k){var l=logOf();l.help[k]=(l.help[k]||0)+1;S.helpUsed=S.helpUsed||k;ev({t:"help",k:k});save();}
/* O anki denemeye olay ekle (normal bölümde deneme kaydı, testte o anki soru) */
function ev(o){
  if(!S)return;o.move=S.moves;
  if(S.att)S.att.events.push(o);
  else if(S.qsession){var rd=S.qsession.rounds[Math.min(S.round,S.qsession.rounds.length-1)];(rd.events=rd.events||[]).push(o);}
}
function got(i){return PL().done[LEVELS[i].id]||0;}
function unlocked(i){return owned(i)&&(i===0||LEVELS[i].first||got(i-1)>0);}
function t(k){return TXT[prog.lang][k];}
function pt(type){return PIECES[type][prog.lang];}

function buildT2K(){

  Object.keys(PIECES).forEach(function(pc){put("name."+pc,pt(pc).name);put("name."+pc,pt(pc).name+"!");put("intro."+pc,pt(pc).intro);put("wrong."+pc,pt(pc).wrong);});

/* Metni bilinen cümlelere böler (örn. hata açıklaması + "Parlayan noktalara dokun!") */
function resolveParts(text){
  if(!T2K||T2KL!==prog.lang)buildT2K();
  var parts=[],rest=String(text).trim(),guard=0;
  while(rest&&guard++<8){
    var best=null;
    Object.keys(T2K).forEach(function(s){if(rest.indexOf(s)===0&&(!best||s.length>best.length))best=s;});
    if(!best){parts.push({text:rest});break;}
    parts.push({key:T2K[best],text:best});rest=rest.slice(best.length).trim();
  }
  return parts;
}

  stopVoice();if(prog.muted||!text)return;
  var tok=vTok,parts=resolveParts(text);

    if(tok!==vTok||!parts.length)return;
    var p=parts.shift(),n=p.key?VKEY[p.key]:0,src=(prog.lang==="tr"&&n)?VOICE[n]:null,done=false;
    function go(){if(done)return;done=true;next();}
    /* Kayıtlı ses açılmazsa aynı cümle cihaz sesiyle; o da yoksa balon ve "Dinle" düğmesi dikkat çeker */

}

function whyKey(ty,pos,rocks,n,c,r){
  var dx=c-pos[0],dy=r-pos[1],ax=Math.abs(dx),ay=Math.abs(dy),onRock=rocks.has(key(c,r));
  if(ty==="rook"||ty==="bishop"||ty==="queen"){

    if((ty==="rook"&&straight)||(ty==="bishop"&&diag)||(ty==="queen"&&(straight||diag)))return onRock?"w_rock":"w_blocked";
    if(ty==="bishop"&&(c+r)%2!==(pos[0]+pos[1])%2)return "w_color";
    return "rule";
  }
  if(ty==="king")return Math.max(ax,ay)===1?"w_rock":"rule";
  if(ty==="knight")return ((ax===1&&ay===2)||(ax===2&&ay===1))?"w_rock":"rule";
  if(ty==="pawn"){
    if(dy>=0)return "w_pawnBack";
    if(dy===-1&&ax===1)return "w_pawnDiag";
    if(dx===0&&dy===-1)return "w_pawnFront";

/* ---------- Bil bakalım ---------- */
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
/* Beceriye göre soru üretir.
   basic: engelsiz tahtada temel hareket; yanlış seçenek hareket kuralına uymayan bir kare.
   rule : taşa özgü kural; kale/vezir: kayanın arkası, fil: başka renk, şah: iki adım,
          at: kayaların üstünden atlama, piyon: çapraz yeme.

function genRound(pc,skill,avoid){
  var O=[[1,0],[-1,0],[0,1],[0,-1]],D=[[1,1],[1,-1],[-1,1],[-1,-1]];
  for(var tr=0;tr<800;tr++){
    var st=pc==="pawn"?[ri(1,6),ri(2,6)]:[ri(0,7),ri(0,7)],rocks=[],enemies=[],ray=null,goodPick=null,wrongOk;
    if(avoid&&k2(st)===k2(avoid.start))continue;
    if(skill==="basic"){
      wrongOk=function(k){return pc==="pawn"?(k==="w_pawnBack"||k==="w_pawnDiag"):k==="rule";};
    }else if(pc==="rook"||pc==="queen"){
      var dirs=pc==="rook"?O:O.concat(D),dd=dirs[ri(0,dirs.length-1)],dist=ri(2,3),rk=[st[0]+dd[0]*dist,st[1]+dd[1]*dist];
      if(!inB(rk[0],rk[1],8)||!inB(rk[0]+dd[0],rk[1]+dd[1],8))continue;
      rocks.push(rk);ray={d:dd,from:dist};
      wrongOk=function(k){return k==="w_blocked";};
    }else if(pc==="bishop"){
      wrongOk=function(k){return k==="w_color";};
    }else if(pc==="king"){
      wrongOk=function(k,c,r){var dx=Math.abs(c-st[0]),dy=Math.abs(r-st[1]);return k==="rule"&&Math.max(dx,dy)===2&&(dx===0||dy===0||dx===dy);};
    }else if(pc==="knight"){
      O.concat(D).forEach(function(d){var q=[st[0]+d[0],st[1]+d[1]];if(inB(q[0],q[1],8))rocks.push(q);});
      wrongOk=function(k,c,r){var dx=Math.abs(c-st[0]),dy=Math.abs(r-st[1]);return k==="rule"&&((dx===0&&dy===2)||(dx===2&&dy===0)||(dx===2&&dy===2));};
    }else if(pc==="pawn"){
      var side=Math.random()<.5?-1:1,en=[st[0]+side,st[1]-1];
      if(!inB(en[0],en[1],8)||!inB(st[0]-side,st[1]-1,8))continue;
      enemies.push(en);goodPick=en;
      wrongOk=function(k){return k==="w_pawnDiag";};
    }
    var RS=new Set(rocks.map(k2)),ES=new Set(enemies.map(k2));
    var legal=genMoves(pc,st,RS,ES,8);if(!legal.length)continue;
    var LS=new Set(legal.map(k2)),goods=legal;
    if(goodPick)goods=[goodPick];
    else if(pc!=="king"&&pc!=="knight"&&pc!=="pawn"){var far=legal.filter(function(m){return Math.max(Math.abs(m[0]-st[0]),Math.abs(m[1]-st[1]))>=2;});if(far.length)goods=far;}
    var good=goods[ri(0,goods.length-1)],wrongs=[];
    for(var c=0;c<8;c++)for(var r=0;r<8;r++){
      var k=key(c,r);if(LS.has(k)||RS.has(k)||ES.has(k)||k===k2(st))continue;
      if(Math.max(Math.abs(c-st[0]),Math.abs(r-st[1]))>4)continue;
      if(ray){var s=-1;for(var q=ray.from+1;q<8;q++){if(st[0]+ray.d[0]*q===c&&st[1]+ray.d[1]*q===r)s=q;}if(s<0)continue;}
      if(wrongOk(whyKey(pc,st,RS,8,c,r),c,r))wrongs.push([c,r]);
    }
    if(!wrongs.length)continue;
    var wrong=wrongs[ri(0,wrongs.length-1)];
    if(Math.abs(wrong[0]-good[0])+Math.abs(wrong[1]-good[1])<2)continue;
    return {start:st,rocks:rocks,enemies:enemies,opts:Math.random()<.5?[good,wrong]:[wrong,good]};
  }

}

  place(p,[c,r],S.n);

/* ---------- Konfeti ---------- */
function confetti(){
  if(RM)return;
  var cv=$("confetti"),ctx=cv.getContext&&cv.getContext("2d");if(!ctx)return;
  var w=cv.width=cv.offsetWidth*2,h=cv.height=cv.offsetHeight*2;
  var cols=["#FFC83D","#FF7A59","#24B3A2","#9B6BE0","#3E7BE0","#EE6FA0"],parts=[];
  for(var i=0;i<90;i++){var side=i%2?1:-1;
    parts.push({x:w/2+side*w*.38,y:h*.55,vx:-side*rnd(6,22),vy:-rnd(22,40),s:rnd(10,18),a:rnd(0,6),va:rnd(-.25,.25),fl:rnd(0,6),vf:rnd(.15,.35),c:cols[i%cols.length]});}
  var t0=performance.now();
  (function frame(tm){
    ctx.clearRect(0,0,w,h);
    parts.forEach(function(p){
      p.vy+=.85;p.vy*=.985;p.vx*=.97;p.x+=p.vx+Math.sin(p.fl)*1.6;p.y+=p.vy;p.a+=p.va;p.fl+=p.vf;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.scale(1,Math.cos(p.fl));
      ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();
    });
    if(tm-t0<2600&&!$("winModal").hidden)requestAnimationFrame(frame);else ctx.clearRect(0,0,w,h);
  })(t0);
}

    '<div class="row" style="margin-top:14px"><button class="btn soft" data-close="1">'+t("cancel")+'</button></div>';

var PRODUCT="tam_surum",IAP=NATIVE&&window.Capacitor.Plugins?window.Capacitor.Plugins.NativePurchases:null,priceText="";
function ownsFull(list){return (list||[]).some(function(p){return p&&p.productIdentifier===PRODUCT&&(p.purchaseState===undefined||String(p.purchaseState)==="1");});}
function syncPurchases(quiet){
  if(!IAP)return Promise.resolve(null);
  return IAP.getPurchases({productType:"inapp"}).then(function(r){
    var own=ownsFull(r&&r.purchases);
    if(own!==!!prog.full){prog.full=own;save();renderMap();}
    return own;
  }).catch(function(){return null;});
}
function loadPrice(){
  if(!IAP)return;
  IAP.getProduct({productIdentifier:PRODUCT,productType:"inapp"}).then(function(r){
    var pr=r&&(r.product||r);priceText=(pr&&(pr.priceString||pr.formattedPrice))||"";
    var b=document.querySelector('#gateCard [data-buy]');if(b&&priceText)b.textContent=t("buy")+" · "+priceText;
  }).catch(function(){});
}
function showOffer(){
  sfx.star();
  var buyLbl=NATIVE?(t("buy")+(priceText?" · "+priceText:"")):t("demoUnlock");
  $("gateCard").innerHTML='<div class="hero">'+pieceSVG("king")+'</div><h3 style="font-size:28px">'+t("full")+'</h3>'+
    '<ul class="perks">'+t("perks").map(function(x){return "<li>"+CHECK+x.replace("{n}",LEVELS.filter(function(_,i){return isPaid(i);}).length)+"</li>";}).join("")+'</ul>'+
    '<p class="note" id="buyNote">'+(NATIVE?t("noteApp"):t("note"))+'</p>'+
    '<div class="row"><button class="btn soft" data-close="1">'+t("later")+'</button><button class="btn" data-buy="1">'+buyLbl+'</button></div>'+
    (NATIVE?'<div class="row" style="margin-top:10px"><button class="sbtn" data-restorebuy="1">'+t("restoreBuy")+'</button></div>':'');
  randomBlink($("gateCard"));
  if(NATIVE&&!priceText)loadPrice();
  $("gateCard").onclick=function(e){
    if(e.target.closest("[data-close]")){$("gateModal").hidden=true;return;}
    var note=$("buyNote");
    if(e.target.closest("[data-restorebuy]")){
      note.textContent=t("buyWait");
      syncPurchases().then(function(own){
        if(own){$("gateModal").hidden=true;sfx.win();renderMap();}
        else note.textContent=own===null?t("buyErr"):t("restoreNone");
      });
      return;
    }
    if(!e.target.closest("[data-buy]"))return;
    if(!NATIVE){prog.full=true;save();$("gateModal").hidden=true;sfx.win();renderMap();return;}
    if(!IAP){note.textContent=t("buyErr");return;}
    var btn=e.target.closest("[data-buy]");btn.disabled=true;note.textContent=t("buyWait");
    IAP.purchaseProduct({productIdentifier:PRODUCT,productType:"inapp"}).then(function(tr){
      btn.disabled=false;
      if(tr&&tr.purchaseState!==undefined&&String(tr.purchaseState)!=="1"){note.textContent=t("buyPending");return;}
      prog.full=true;save();$("gateModal").hidden=true;sfx.win();renderMap();
    }).catch(function(err){
      btn.disabled=false;
      var m=String((err&&(err.message||err.code))||"").toLowerCase();
      note.textContent=/cancel/.test(m)?t("buyCancel"):(/already|owned/.test(m)?t("buyWait"):t("buyErr"));
      if(/already|owned/.test(m))syncPurchases().then(function(own){if(own){$("gateModal").hidden=true;sfx.win();renderMap();}});
    });
  };
}
/* Android geri tuşu: açık pencereyi kapatır, bölümden haritaya döner, haritadaysa uygulamayı arka plana alır */
if(NATIVE&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App){
  window.Capacitor.Plugins.App.addListener("backButton",function(){
    var sh=$("helpSheet");if(sh){sh.remove();return;}
    var open=["panelModal","pickerModal","gateModal","winModal"].filter(function(id){return !$(id).hidden;});
    if(open.length){
      if(open[0]==="winModal"){goMap(false);return;}
      $(open[0]).hidden=true;stopVSeq&&stopVSeq();if(open[0]==="panelModal")renderMap();return;
    }
    if(!$("playScreen").hidden){goMap(false);return;}
    window.Capacitor.Plugins.App.minimizeApp();
  });
  window.Capacitor.Plugins.App.addListener("pause",function(){markOpen("interrupted");stopVoice();});
}

/* ---------- Oyuncular ---------- */
function openPicker(){
  var h='<h3 style="font-size:30px">'+t("who")+'</h3><div class="pickgrid">';
  Object.keys(prog.players).forEach(function(id){var pl=prog.players[id];
    h+='<button data-pick="'+id+'" class="'+(id===prog.current?"cur":"")+'">'+avatar(pl)+'<span class="pn">'+esc(pl.name)+'</span></button>';});
  h+='</div><p class="note">'+t("addHint")+'</p><div class="row"><button class="btn soft" data-close="1">'+t("close")+'</button></div>';
  $("pickerCard").innerHTML=h;$("pickerModal").hidden=false;
}
$("pickerCard").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.pick){prog.current=b.dataset.pick;save();sfx.tick();renderMap();}
  $("pickerModal").hidden=true;
});
$("playerChip").addEventListener("click",function(){sfx.tick();openPicker();});
$("adultArea").addEventListener("click",function(){sfx.tick();openGate(function(){$("gateModal").hidden=true;renderPanel("main");$("panelModal").hidden=false;});});

/* ---------- Yetişkin alanı ---------- */
var delAsk=null,resetAsk=null,dataPid=null,vSeq=false,vCur=0,vSeqTok=0;
/* Numara -> yazı (Türkçe metinlerden) */
function VLINES(){
  var keyOf={};Object.keys(VKEY).forEach(function(k){keyOf[VKEY[k]]=k;});
  return Object.keys(keyOf).map(Number).sort(function(a,b){return a-b;}).map(function(n){
    var k=keyOf[n],a=k.split("."),tr=TXT.tr,tx="";
    if(a[0]==="name")tx=PIECES[a[1]].tr.name+"!";else if(a[0]==="intro")tx=PIECES[a[1]].tr.intro;else if(a[0]==="wrong")tx=PIECES[a[1]].tr.wrong;
    else if(a[0]==="txt")tx=tr[a[1]];else{var L=LEVELS.filter(function(x){return "say."+x.id===k;})[0];tx=L?L.say.tr:"";}
    return {n:n,text:tx};
  });
}
function markCur(n){vCur=n;Array.prototype.forEach.call(document.querySelectorAll(".vrow.cur"),function(e){e.classList.remove("cur");});var r=$("vr"+n);if(r){r.classList.add("cur");try{r.scrollIntoView({block:"nearest"});}catch(_){}}}
function playLine(n,done){
  stopVoice();if(!VOICE[n]){if(done)done();return;}
  markCur(n);
  try{var a=new Audio(VOICE[n]);vAudio=a;a.onended=function(){if(done)done();};a.onerror=function(){if(done)done();};var pr=a.play();if(pr&&pr.catch)pr.catch(function(){if(done)done();});}catch(e){if(done)done();}
}
function seqFrom(i){var rows=VLINES(),tok=++vSeqTok;(function go(k){if(!vSeq||tok!==vSeqTok||k>=rows.length){vSeq=false;return;}playLine(rows[k].n,function(){setTimeout(function(){go(k+1);},350);});})(i);}
function stopVSeq(){if(vSeq){vSeq=false;vSeqTok++;stopVoice();}}
function summaryHTML(pl){
  var s={done:0,crowns:0,tries:0,undo:0,adult:0,touch:0,err:{},help:{}};
  LEVELS.forEach(function(L){
    var v=pl.done[L.id]||0;if(v)s.done++;if(v===3)s.crowns++;
    var g=pl.log[L.id];if(!g)return;
    s.tries+=g.tries||0;s.undo+=g.undo||0;s.adult+=g.adult||0;s.touch+=g.touch||0;
    Object.keys(g.err||{}).forEach(function(k){s.err[k]=(s.err[k]||0)+g.err[k];});
    Object.keys(g.help||{}).forEach(function(k){s.help[k]=(s.help[k]||0)+g.help[k];});
  });
  var L=t("sum"),h='<div class="sum">';
  function row(a,b){h+='<span>'+a+'</span><b>'+b+'</b>';}
  var adultDone=0;LEVELS.forEach(function(Lv){var g=pl.log[Lv.id];((g&&g.attempts)||[]).forEach(function(a){if(a.status==="completed"&&a.events.some(function(x){return x.t==="adult";}))adultDone++;});});
  var qTouch=0,kinds={};
  LEVELS.forEach(function(Lv){var g=pl.log[Lv.id];if(!g)return;
    Object.keys(g.adultKinds||{}).forEach(function(k){kinds[k]=(kinds[k]||0)+g.adultKinds[k];});
    ((g.quizzes)||[]).forEach(function(ss){ss.rounds.forEach(function(r){(r.answers||[]).forEach(function(a){if(a.touch)qTouch++;});(r.misses||[]).forEach(function(m){if(m.touch)qTouch++;});});});});
  row(L.levels,s.done+" / "+LEVELS.length);row(L.crowns,s.crowns);row(L.tries,s.tries);row(L.undo,s.undo);
  row(L.adult,s.adult);
  ["repeat","touch","chess"].forEach(function(k){if(kinds[k])row('<span class="z">· '+t("hk_"+k)+'</span>',kinds[k]);});
  row(L.adultDone,adultDone);
  row(L.touchLv,s.touch);row(L.touchQ,qTouch);
  h+='<span class="z" style="grid-column:1 / -1;font-size:13px">'+L.touchNote+'</span>';
  h+='<span class="h">'+L.quiz+'</span><span class="z" style="grid-column:1 / -1;font-size:13px">'+L.quizNote+'</span>';
  WORLDS.forEach(function(w){
    var q=pl.log[w.piece+"-quiz"],uf=0,ut=0,af=0,at=0;
    ((q&&q.quizzes)||[]).forEach(function(ss){ss.rounds.forEach(function(r){if(r.answers.length){var a0=r.answers[0];if(a0.adultBefore){at++;if(a0.correct)af++;}else{ut++;if(a0.correct)uf++;}}});});
    row(pt(w.piece).name,(ut||at)?(L.unaided+" "+(ut?uf+"/"+ut:"–")+' <small class="z">· '+L.aidedL+" "+(at?af+"/"+at:"–")+'</small>'):'<span class="z">–</span>');
  });
  h+='<span class="h">'+L.errs+'</span>';
  var ek=Object.keys(s.err).sort(function(a,b){return s.err[b]-s.err[a];});
  if(!ek.length)h+='<span class="z" style="grid-column:1 / -1">'+L.none+'</span>';
  ek.forEach(function(k){row(esc(t("errL")[k]||k),+s.err[k]||0);});
  h+='<span class="h">'+L.helps+'</span>';
  var hk=Object.keys(s.help);
  if(!hk.length)h+='<span class="z" style="grid-column:1 / -1">'+L.none+'</span>';
  hk.forEach(function(k){row(esc(t("helpL")[k]||k),+s.help[k]||0);});
  return h+'</div>';
}
function renderPanel(view){
  var h="",ids=Object.keys(prog.players);
  if(view==="main"){
    h+='<h3 style="font-size:28px">'+t("adultArea")+'</h3>';
    save();
    if(saveFail)h+='<p class="warnbox">'+t("saveFail")+' <button class="sbtn" data-data="1">'+t("data")+'</button></p>';
    h+='<div class="sec"><h4>'+t("players")+'</h4><p class="small note">'+t("codeTip")+'</p>';
    ids.forEach(function(id){var pl=prog.players[id];
      h+='<div class="prow">'+avatar(pl)+'<span class="pn">'+esc(pl.name)+(id===prog.current?' <small class="z">· '+t("active")+'</small>':'')+'</span>'+
        (resetAsk===id?'<button class="sbtn warn" data-resetok="'+id+'">'+t("resetSure")+'</button>':'<button class="sbtn" data-reset="'+id+'">'+t("reset")+'</button>')+
        (ids.length>1?(delAsk===id?'<button class="sbtn warn" data-delok="'+id+'">'+t("delSure")+'</button>':'<button class="sbtn" data-del="'+id+'">'+t("del")+'</button>'):'')+'</div>';});
    h+='<div class="prow"><input id="newName" maxlength="16" placeholder="'+t("namePh")+'" autocomplete="off"><button class="sbtn on" data-add="1">'+t("add")+'</button></div></div>';
    h+='<div class="sec"><h4>'+t("langT")+'</h4><div class="seg" style="display:inline-flex"><button data-setl="tr" aria-pressed="'+(prog.lang==="tr")+'">Türkçe</button><button data-setl="en" aria-pressed="'+(prog.lang==="en")+'">English</button></div></div>';
    h+='<div class="sec"><h4>'+t("trial")+'</h4><p class="small note">'+t("trialDesc")+'</p><button class="sbtn'+(prog.trial?' on':'')+'" data-trial="1">'+t("trial")+': '+(prog.trial?t("trialOn"):t("trialOff"))+'</button></div>';
    h+='<div class="sec"><h4>'+t("voiceT")+'</h4><p class="small note">'+t("voiceS")(voiceCount(),Object.keys(VKEY).length)+'</p>'+(voiceCount()?'<button class="sbtn" data-vlist="1">'+t("voiceList")+'</button>':'')+'</div>';
    h+='<div class="sec"><h4>'+t("data")+'</h4><button class="sbtn" data-data="1">'+t("show")+'</button></div>';
    h+='<div class="sec"><h4>'+t("full")+'</h4><button class="sbtn" data-full="1">'+t("fullBtn")+'</button></div>';
    h+='<div class="row"><button class="btn" data-close="1">'+t("close")+'</button></div>';
  }else if(view==="voice"){
    var flags=prog.vflags||{},rows=VLINES();
    h+='<h3 style="font-size:26px">'+t("voiceT")+'</h3><p class="small note" style="text-align:left">'+t("voiceHelp")+'</p>';
    h+='<div class="row" style="margin-top:10px"><button class="sbtn" data-vall="1">'+(vSeq?t("stopAll"):t("playAll"))+'</button><button class="sbtn" data-vcopy="1">'+t("flagsCopy")+'</button></div><div class="vlist">';
    rows.forEach(function(r){
      h+='<div class="vrow'+(vCur===r.n?' cur':'')+'" id="vr'+r.n+'"><button class="vplay" data-vp="'+r.n+'" aria-label="'+r.n+'"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="#2F2A3A"/></svg></button>'+
        '<span class="vn">'+r.n+(VUNSURE.indexOf(r.n)>=0?'<i class="vdot"></i>':'')+'</span><span class="vt">'+esc(r.text)+'</span>'+
        '<button class="sbtn'+(flags[r.n]?' warn':'')+'" data-vf="'+r.n+'">'+t("wrongMark")+'</button></div>';
    });
    h+='</div><div class="row"><button class="btn soft" data-back="1">'+t("back")+'</button></div>';
  }else{
    var pid=prog.players[dataPid]?dataPid:prog.current,pl=prog.players[pid];
    h+='<h3 style="font-size:26px">'+t("data")+'</h3><div class="sec" style="display:flex;flex-wrap:wrap;gap:8px">';
    ids.forEach(function(id){var q=prog.players[id];h+='<button class="sbtn'+(id===pid?' on':'')+'" data-dp="'+id+'">'+esc(q.name)+'</button>';});
    h+='</div>'+summaryHTML(pl);
    if(prog.legacyV1)h+='<p class="note">'+t("sum").legacy+'</p>';
    var out={app:"satranc-adasi",format:4,exported:new Date().toISOString(),player:{name:pl.name},done:pl.done,log:pl.log};
    h+='<textarea id="jsonOut" readonly>'+esc(JSON.stringify(out))+'</textarea>';
    h+='<div class="row"><button class="btn soft" data-back="1">'+t("back")+'</button><button class="btn" data-copy="1">'+t("copy")+'</button></div>';
    h+='<div class="sec"><h4>'+t("restoreT")+'</h4><p class="small note">'+t("restoreP")+'</p><textarea id="jsonIn" placeholder="{&quot;app&quot;:&quot;satranc-adasi&quot;, ...}"></textarea>'+
      '<div class="row" style="margin-top:8px"><label class="sbtn" style="cursor:pointer">'+t("restoreFile")+'<input type="file" id="fileIn" accept=".json,.txt,application/json,text/plain" hidden></label><button class="sbtn on" data-restore="1">'+t("restoreBtn")+'</button></div><p class="small note" id="restoreMsg"></p></div>';
  }
  $("panelCard").innerHTML=h;
}
$("panelCard").addEventListener("change",function(e){
  if(e.target.id!=="fileIn"||!e.target.files||!e.target.files[0])return;
  var fr=new FileReader();fr.onload=function(){$("jsonIn").value=String(fr.result||"");};fr.readAsText(e.target.files[0]);
});
$("panelCard").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.close){stopVSeq();$("panelModal").hidden=true;delAsk=null;resetAsk=null;renderMap();return;}
  if(b.dataset.del){delAsk=b.dataset.del;resetAsk=null;renderPanel("main");return;}
  if(b.dataset.reset){resetAsk=b.dataset.reset;delAsk=null;renderPanel("main");return;}
  if(b.dataset.resetok){var rp=prog.players[b.dataset.resetok];rp.done={};rp.log={};rp.reset=new Date().toISOString();resetAsk=null;save();renderPanel("main");return;}
  if(b.dataset.delok){
    delete prog.players[b.dataset.delok];delAsk=null;
    if(!prog.players[prog.current])prog.current=Object.keys(prog.players)[0];
    save();renderPanel("main");return;
  }
  if(b.dataset.add){
    var inp=$("newName"),nm=(inp.value||"").trim().slice(0,16),n=Object.keys(prog.players).length;
    if(!nm)nm=t("player")+" "+(n+1);
    var id="p"+Date.now().toString(36);
    var fs=freeSlot();prog.players[id]={name:nm,color:PCOL[fs],avatar:AVA[fs],done:{},log:{},created:new Date().toISOString()};
    prog.current=id;save();sfx.tick();renderPanel("main");return;
  }
  if(b.dataset.setl){if(b.dataset.setl!==prog.lang){prog.lang=b.dataset.setl;save();applyLang();renderMap();}renderPanel("main");return;}
  if(b.dataset.trial){prog.trial=!prog.trial;save();renderPanel("main");return;}
  if(b.dataset.data){dataPid=prog.current;renderPanel("data");return;}
  if(b.dataset.dp){dataPid=b.dataset.dp;renderPanel("data");return;}
  if(b.dataset.back){stopVSeq();renderPanel("main");return;}
  if(b.dataset.restore){
    var msg=$("restoreMsg"),raw=($("jsonIn").value||"").trim(),d;
    try{d=JSON.parse(raw);}catch(_){msg.textContent=t("restoreBad");return;}
    if(!d||d.app!=="satranc-adasi"||typeof d.done!=="object"||typeof d.log!=="object"){msg.textContent=t("restoreBad");return;}
    var known={};LEVELS.forEach(function(L){known[L.id]=1;});
    var done={};Object.keys(d.done).forEach(function(k){var v=+d.done[k];if(known[k]&&(v===1||v===3))done[k]=v;});
    var n=Object.keys(prog.players).length,id="p"+Date.now().toString(36),nm=String((d.player&&d.player.name)||t("player")).slice(0,16);
    var fs=freeSlot();prog.players[id]={name:nm,color:PCOL[fs],avatar:AVA[fs],done:done,log:cleanLog(d.log),created:new Date().toISOString(),restored:typeof d.exported==="string"?d.exported.slice(0,40):true};
    prog.current=id;save();msg.textContent=t("restoreOk")(nm,Object.keys(done).length);return;
  }
  if(b.dataset.vlist){renderPanel("voice");return;}
  if(b.dataset.vp){stopVSeq();playLine(+b.dataset.vp);return;}
  if(b.dataset.vf){var f=prog.vflags=prog.vflags||{},k=+b.dataset.vf;if(f[k])delete f[k];else f[k]=1;save();b.classList.toggle("warn",!!f[k]);return;}
  if(b.dataset.vall){if(vSeq)stopVSeq();else{vSeq=true;seqFrom(0);}renderPanel("voice");return;}
  if(b.dataset.vcopy){
    var ks=Object.keys(prog.vflags||{}).map(Number).sort(function(a,c){return a-c;});
    var txt=ks.length?ks.map(function(k){var r=VLINES().filter(function(x){return x.n===k;})[0];return k+": "+(r?r.text:"");}).join("\n"):t("flagsNone");
    try{navigator.clipboard.writeText(txt).then(function(){b.textContent=t("copied");},function(){b.textContent=txt.slice(0,60);});}catch(_){b.textContent=t("copyFail");}
    return;
  }
  if(b.dataset.full){$("panelModal").hidden=true;$("gateModal").hidden=false;showOffer();return;}
  if(b.dataset.copy){
    var ta=$("jsonOut"),txt=ta.value;
    function fail(){try{ta.focus();ta.select();}catch(_){}b.textContent=t("copyFail");}
    try{navigator.clipboard.writeText(txt).then(function(){b.textContent=t("copied");},fail);}catch(_){fail();}
  }
});

try{if(window.speechSynthesis){pickVoices();window.speechSynthesis.addEventListener("voiceschanged",pickVoices);}}catch(e){}
applyLang();renderMap();
if(NATIVE){syncPurchases();document.addEventListener("resume",function(){syncPurchases();});}
})();
